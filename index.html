<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3498db">
<title>备忘录日历</title>
<style>
:root {
  --urgent: #e74c3c;
  --important: #f39c12;
  --normal: #3498db;
  --low: #95a5a6;
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #e8e8e8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: max(16px, var(--safe-top)) 12px max(24px, var(--safe-bottom));
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding: 0 4px;
}
.month-title {
  font-size: 22px; font-weight: 700; color: var(--text);
  letter-spacing: -0.3px;
}
.nav-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text); cursor: pointer;
  transition: all 0.2s; box-shadow: var(--shadow);
}
.nav-btn:active { transform: scale(0.92); background: #f0f0f0; }
.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  margin-bottom: 8px;
}
.weekday {
  text-align: center; font-weight: 600; color: var(--text-light);
  font-size: 12px; padding: 8px 0;
}
.days-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
}
.day-cell {
  background: var(--card); border-radius: var(--radius);
  padding: 6px 4px 4px; min-height: 90px;
  border: 1px solid var(--border); transition: all 0.15s;
  position: relative; display: flex; flex-direction: column;
  box-shadow: var(--shadow);
}
.day-cell:active { transform: scale(0.97); }
.day-cell.today {
  border-color: var(--normal); background: #f0f8ff;
  box-shadow: 0 0 0 2px rgba(52,152,219,0.15), var(--shadow);
}
.day-cell.other-month { opacity: 0.35; }
.day-cell.weekend .day-num { color: var(--urgent); }
.day-num {
  font-weight: 700; font-size: 14px; color: var(--text);
  margin-bottom: 3px; padding-left: 4px;
}
.day-cell.today .day-num { color: var(--normal); }
.task-list {
  display: flex; flex-direction: column; gap: 2px;
  flex: 1; overflow: hidden;
}
.task-item {
  font-size: 10px; padding: 2px 5px; border-radius: 5px;
  color: #fff; cursor: pointer; display: flex;
  align-items: center; word-break: break-all; line-height: 1.25;
  min-height: 20px;
}
.task-item:active { opacity: 0.7; }
.task-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 14px; height: 14px; background: rgba(255,255,255,0.25);
  border-radius: 3px; font-size: 9px; font-weight: 700;
  margin-right: 4px; flex-shrink: 0;
}
.task-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-item .del {
  opacity: 0; transition: opacity 0.2s; font-size: 10px;
  margin-left: 3px; flex-shrink: 0; width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
}
.task-item:hover .del, .task-item:active .del { opacity: 1; }
.task-item .del:active { background: rgba(255,255,255,0.3); }
.add-btn {
  width: 100%; margin-top: 3px; padding: 2px;
  border: 1px dashed #ddd; border-radius: 5px;
  background: transparent; color: #bbb; font-size: 10px;
  cursor: pointer; transition: all 0.2s;
}
.add-btn:active { border-color: var(--normal); color: var(--normal); background: rgba(52,152,219,0.05); }
.legend {
  display: flex; gap: 12px; margin-top: 16px;
  padding: 12px; background: var(--card); border-radius: var(--radius);
  justify-content: center; flex-wrap: wrap; box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }
.sync-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding: 10px 14px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--border);
  flex-wrap: wrap; gap: 8px;
}
.sync-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-light); flex-wrap: wrap; }
.sync-status { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.sync-status.online { background: #2ecc71; }
.sync-status.syncing { background: var(--important); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.sync-btn {
  padding: 6px 14px; border-radius: 8px; border: none;
  background: var(--normal); color: #fff; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.sync-btn:active { transform: scale(0.95); opacity: 0.85; }
.sync-btn:disabled { background: var(--low); cursor: not-allowed; }
.sync-code {
  font-family: "SF Mono", "Courier New", monospace;
  font-size: 11px; background: #f0f0f0; padding: 2px 6px;
  border-radius: 4px; color: var(--text);
}
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: none; justify-content: center; align-items: flex-end;
  z-index: 100; backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border-radius: 20px 20px 0 0;
  padding: 20px 20px max(24px, var(--safe-bottom));
  width: 100%; max-width: 480px;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal h3 { margin: 0 0 14px 0; color: var(--text); font-size: 18px; }
.modal input, .modal select {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 15px; margin-bottom: 12px;
  -webkit-appearance: none; appearance: none;
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--normal); }
.priority-options { display: flex; gap: 8px; margin-bottom: 16px; }
.priority-btn {
  flex: 1; padding: 10px 4px; border: 2px solid transparent;
  border-radius: 10px; font-size: 12px; font-weight: 600;
  cursor: pointer; color: #fff; transition: all 0.15s;
}
.priority-btn:active { transform: scale(0.95); }
.priority-btn.selected { box-shadow: 0 0 0 2px var(--text); }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button {
  flex: 1; padding: 12px; border-radius: 12px; border: none;
  font-size: 15px; cursor: pointer; font-weight: 600;
  -webkit-appearance: none;
}
.btn-primary { background: var(--normal); color: #fff; }
.btn-primary:active { opacity: 0.85; }
.btn-secondary { background: #f0f0f0; color: #555; }
.btn-secondary:active { background: #e0e0e0; }

@supports (-webkit-touch-callout: none) {
  body { padding-top: max(20px, var(--safe-top)); }
}

@media (max-width: 360px) {
  .day-cell { min-height: 80px; padding: 4px 3px 3px; }
  .day-num { font-size: 12px; }
  .task-item { font-size: 9px; padding: 1px 3px; }
  .task-num { min-width: 12px; height: 12px; font-size: 8px; }
  .add-btn { font-size: 9px; }
  .month-title { font-size: 18px; }
}

@media (max-height: 500px) and (orientation: landscape) {
  .day-cell { min-height: 60px; }
}

.toast {
  position: fixed; bottom: max(80px, calc(var(--safe-bottom) + 60px));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
  border-radius: 10px; font-size: 13px; opacity: 0;
  transition: all 0.3s; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.setup-overlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; justify-content: center; align-items: center;
  z-index: 300;
}
.setup-box {
  background: var(--card); border-radius: var(--radius);
  padding: 32px 24px; width: 90%; max-width: 360px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  text-align: center;
}
.setup-box h2 { margin-bottom: 8px; color: var(--text); }
.setup-box p { color: var(--text-light); font-size: 14px; margin-bottom: 20px; }
.setup-box input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 15px; margin-bottom: 12px;
  text-align: center; letter-spacing: 2px;
}
.setup-box input:focus { outline: none; border-color: var(--normal); }
.setup-box .hint { font-size: 12px; color: var(--text-light); margin-top: 12px; }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-box">
    <h2>🔐 欢迎使用备忘录日历</h2>
    <p>设置你的专属同步码，用于加密数据并在多设备同步</p>
    <input type="text" id="setupCode" placeholder="输入同步码（至少4位）" maxlength="20" onkeydown="if(event.key==='Enter')doSetup()">
    <button class="btn-primary" style="width:100%;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;" onclick="doSetup()">开始使用</button>
    <p class="hint">同步码用于加密你的数据，请牢记<br>不同同步码 = 完全隔离的数据空间</p>
  </div>
</div>

<div class="sync-bar" id="syncBar" style="display:none">
  <div class="sync-info">
    <div class="sync-status" id="syncStatus"></div>
    <span id="syncText">未同步</span>
    <span class="sync-code" id="syncCode"></span>
  </div>
  <button class="sync-btn" id="syncBtn" onclick="syncNow()">↻ 同步</button>
</div>

<div class="app-header" id="appHeader" style="display:none">
  <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
  <div class="month-title" id="monthTitle"></div>
  <button class="nav-btn" onclick="changeMonth(1)">▶</button>
</div>

<div class="weekdays" id="weekdays" style="display:none">
  <div class="weekday">日</div>
  <div class="weekday">一</div>
  <div class="weekday">二</div>
  <div class="weekday">三</div>
  <div class="weekday">四</div>
  <div class="weekday">五</div>
  <div class="weekday">六</div>
</div>

<div class="days-grid" id="daysGrid"></div>

<div class="legend" id="legend" style="display:none">
  <div class="legend-item"><div class="legend-dot" style="background:var(--urgent)"></div>紧急</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--important)"></div>重要</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--normal)"></div>普通</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--low)"></div>备忘</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">添加事项</h3>
    <input type="text" id="taskInput" placeholder="输入要做的事情..." onkeydown="if(event.key==='Enter')saveTask()">
    <div class="priority-options">
      <button class="priority-btn" style="background:var(--urgent)" data-p="urgent" onclick="selectP(this)">紧急</button>
      <button class="priority-btn" style="background:var(--important)" data-p="important" onclick="selectP(this)">重要</button>
      <button class="priority-btn selected" style="background:var(--normal)" data-p="normal" onclick="selectP(this)">普通</button>
      <button class="priority-btn" style="background:var(--low)" data-p="low" onclick="selectP(this)">备忘</button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 加密工具 ====================
const ENC = {
  async deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  },
  async encrypt(text, password) {
    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(password, salt);
    const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
    const buf = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
    buf.set(salt, 0); buf.set(iv, salt.length); buf.set(new Uint8Array(ciphertext), salt.length + iv.length);
    return btoa(String.fromCharCode(...buf));
  },
  async decrypt(base64, password) {
    const buf = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ciphertext = buf.slice(28);
    const key = await this.deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new TextDecoder().decode(decrypted);
  }
};

// ==================== 全局状态 ====================
let currentDate = new Date();
let selectedDateKey = null, selectedPriority = 'normal', editingIdx = null;
let tasks = {}, syncCode = null, syncPassword = null;
const colors = { urgent: '#e74c3c', important: '#f39c12', normal: '#3498db', low: '#95a5a6' };
const API_BASE = location.origin + '/api/sync';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function init() {
  const saved = localStorage.getItem('memoSyncCode');
  if (saved) { syncCode = saved; syncPassword = saved; document.getElementById('setupOverlay').style.display = 'none'; showApp(); loadLocalData(); renderCalendar(); syncNow(true); }
}

function doSetup() {
  const code = document.getElementById('setupCode').value.trim();
  if (code.length < 4) { showToast('同步码至少4位'); return; }
  syncCode = code; syncPassword = code;
  localStorage.setItem('memoSyncCode', syncCode);
  document.getElementById('setupOverlay').style.display = 'none';
  showApp(); tasks = {}; saveLocalData(); renderCalendar();
  showToast('同步码已设置: ' + syncCode);
}

function showApp() {
  document.getElementById('syncBar').style.display = 'flex';
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('weekdays').style.display = 'grid';
  document.getElementById('legend').style.display = 'flex';
  document.getElementById('syncCode').textContent = syncCode;
}

function loadLocalData() {
  try { const saved = localStorage.getItem('memoTasks_' + syncCode); if (saved) tasks = JSON.parse(saved); }
  catch(e) { tasks = {}; }
}

function saveLocalData() {
  localStorage.setItem('memoTasks_' + syncCode, JSON.stringify(tasks));
}

// ==================== 云端同步 ====================
async function syncNow(silent) {
  const btn = document.getElementById('syncBtn');
  const status = document.getElementById('syncStatus');
  const text = document.getElementById('syncText');
  btn.disabled = true; status.className = 'sync-status syncing'; text.textContent = '同步中...';

  try {
    // 上传
    const payload = JSON.stringify({ data: tasks, timestamp: Date.now() });
    const encrypted = await ENC.encrypt(payload, syncPassword);
    const uploadRes = await fetch(API_BASE + '?code=' + encodeURIComponent(syncCode), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payload: encrypted })
    });
    if (!uploadRes.ok) throw new Error('上传失败 ' + uploadRes.status);

    // 下载
    const downloadRes = await fetch(API_BASE + '?code=' + encodeURIComponent(syncCode));
    if (!downloadRes.ok) throw new Error('下载失败 ' + downloadRes.status);
    const result = await downloadRes.json();

    if (result.payload) {
      const decrypted = await ENC.decrypt(result.payload, syncPassword);
      const cloudData = JSON.parse(decrypted);
      if (cloudData.data && cloudData.timestamp) {
        const localTime = parseInt(localStorage.getItem('memoSyncTime_' + syncCode) || '0');
        if (cloudData.timestamp > localTime) {
          tasks = cloudData.data; saveLocalData();
          localStorage.setItem('memoSyncTime_' + syncCode, cloudData.timestamp);
          renderCalendar();
          if (!silent) showToast('已同步云端数据');
        } else {
          if (!silent) showToast('本地数据已是最新');
        }
      }
    } else {
      if (!silent) showToast('云端暂无数据，已上传');
    }
    localStorage.setItem('memoSyncTime_' + syncCode, Date.now().toString());
    status.className = 'sync-status online'; text.textContent = '已同步';
  } catch(err) {
    status.className = 'sync-status'; text.textContent = '同步失败';
    if (!silent) showToast('同步失败: ' + err.message);
    console.error('Sync error:', err);
  }
  btn.disabled = false; btn.textContent = '↻ 同步';
}

// ==================== 日历 ====================
function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }

function renderCalendar() {
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  document.getElementById('monthTitle').textContent = year + '年 ' + (month + 1) + '月';
  const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
  const firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay(), totalDays = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate(), today = new Date();

  for (let i = startOffset - 1; i >= 0; i--) grid.appendChild(createDayCell(year, month - 1, prevLastDay - i, true));
  for (let d = 1; d <= totalDays; d++) {
    const cell = createDayCell(year, month, d, false);
    if (year === today.getFullYear() && month === today.getMonth() && d === today.getDate()) cell.classList.add('today');
    if (new Date(year, month, d).getDay() === 0 || new Date(year, month, d).getDay() === 6) cell.classList.add('weekend');
    grid.appendChild(cell);
  }
  const remaining = (7 - ((startOffset + totalDays) % 7)) % 7;
  for (let d = 1; d <= remaining; d++) grid.appendChild(createDayCell(year, month + 1, d, true));
}

function createDayCell(year, month, day, otherMonth) {
  const key = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  const cell = document.createElement('div');
  cell.className = 'day-cell' + (otherMonth ? ' other-month' : '');
  cell.innerHTML = '<div class="day-num">' + day + '</div><div class="task-list" id="tl-' + key + '"></div><button class="add-btn" onclick="openModal(&quot;' + key + '&quot;)">+ 添加</button>';
  const list = cell.querySelector('#tl-' + key);
  if (tasks[key]) {
    tasks[key].forEach(function(t, idx) {
      const item = document.createElement('div');
      item.className = 'task-item'; item.style.background = colors[t.priority];
      item.innerHTML = '<span class="task-num">' + (idx + 1) + '</span><span class="task-text">' + escapeHtml(t.text) + '</span><span class="del" onclick="deleteTask(&quot;' + key + '&quot;,' + idx + ',event)">✕</span>';
      item.onclick = function(e) { if (e.target.classList.contains('del')) return; editTask(key, idx); };
      list.appendChild(item);
    });
  }
  return cell;
}

function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

function openModal(key) {
  selectedDateKey = key; editingIdx = null;
  document.getElementById('modalTitle').textContent = key + ' 添加事项';
  document.getElementById('taskInput').value = '';
  document.querySelectorAll('.priority-btn').forEach(function(b) { b.classList.toggle('selected', b.dataset.p === 'normal'); });
  selectedPriority = 'normal'; document.getElementById('modal').classList.add('active');
  setTimeout(function() { document.getElementById('taskInput').focus(); }, 100);
}

function editTask(key, idx) {
  selectedDateKey = key; editingIdx = idx; const t = tasks[key][idx];
  document.getElementById('modalTitle').textContent = key + ' 编辑事项';
  document.getElementById('taskInput').value = t.text;
  document.querySelectorAll('.priority-btn').forEach(function(b) { b.classList.toggle('selected', b.dataset.p === t.priority); });
  selectedPriority = t.priority; document.getElementById('modal').classList.add('active');
  setTimeout(function() { document.getElementById('taskInput').focus(); }, 100);
}

function closeModal() { document.getElementById('modal').classList.remove('active'); editingIdx = null; }

function selectP(btn) {
  document.querySelectorAll('.priority-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected'); selectedPriority = btn.dataset.p;
}

function saveTask() {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) { showToast('请输入内容'); return; }
  if (!tasks[selectedDateKey]) tasks[selectedDateKey] = [];
  if (editingIdx !== null) { tasks[selectedDateKey][editingIdx] = { text: text, priority: selectedPriority }; showToast('已修改'); }
  else { tasks[selectedDateKey].push({ text: text, priority: selectedPriority }); showToast('已添加'); }
  saveLocalData(); closeModal(); renderCalendar(); syncNow(true);
}

function deleteTask(key, idx, e) {
  e.stopPropagation(); tasks[key].splice(idx, 1);
  if (tasks[key].length === 0) delete tasks[key];
  saveLocalData(); renderCalendar(); showToast('已删除'); syncNow(true);
}

document.getElementById('modal').addEventListener('click', function(e) { if (e.target === document.getElementById('modal')) closeModal(); });
document.body.addEventListener('touchmove', function(e) { if (e.target.closest('.modal')) return; if (document.getElementById('modal').classList.contains('active')) e.preventDefault(); }, { passive: false });
init();
</script>
